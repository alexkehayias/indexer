<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>HQ</title>
    <link href="/output.css" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FAFBF8">
    <link rel="apple-touch-icon" href="/icon512_maskable.png">
    <script src="/theme-init.js"></script>
    <script type="module" src="/components/index.js"></script>
  </head>
  <body class="min-h-dvh bg-canvas font-sans text-ink">
    <main class="mx-auto flex min-h-dvh w-full max-w-[920px] flex-col justify-center px-6 py-10">
      <header class="mb-8 flex items-center gap-4">
        <span class="flex size-11 shrink-0 items-center justify-center rounded-[14px] bg-gradient-to-br from-teal to-teal-bright text-white">
          <hq-icon name="home" size="lg"></hq-icon>
        </span>
        <h1 class="text-3xl font-bold tracking-tight text-ink md:text-[44px] md:leading-[1.05]">Welcome back, Alex</h1>
      </header>

      <nav class="grid grid-cols-2 gap-4 md:grid-cols-3">
        <a href="/search/" class="group flex flex-col gap-3 rounded-tile bg-mist p-4 transition-shadow hover:shadow-lg/5">
          <span class="flex size-10 items-center justify-center rounded-icon bg-teal-tint text-teal">
            <hq-icon name="search" size="lg"></hq-icon>
          </span>
          <span>
            <span class="block font-semibold text-ink">Search</span>
            <span class="mt-0.5 block text-sm text-muted">Find notes and tasks</span>
          </span>
        </a>

        <a href="/chat/" class="group flex flex-col gap-3 rounded-tile bg-mist p-4 transition-shadow hover:shadow-lg/5">
          <span class="flex size-10 items-center justify-center rounded-icon bg-amber-tint text-amber">
            <hq-icon name="chat" size="lg"></hq-icon>
          </span>
          <span>
            <span class="block font-semibold text-ink">Chat</span>
            <span class="mt-0.5 block text-sm text-muted">Ask questions with AI</span>
          </span>
        </a>

        <a href="/chat/sessions/" class="group flex flex-col gap-3 rounded-tile bg-mist p-4 transition-shadow hover:shadow-lg/5">
          <span class="flex size-10 items-center justify-center rounded-icon bg-rust-tint text-rust">
            <hq-icon name="sessions" size="lg"></hq-icon>
          </span>
          <span>
            <span class="block font-semibold text-ink">Sessions</span>
            <span class="mt-0.5 block text-sm text-muted">View chat history</span>
          </span>
        </a>

        <a href="/skills/" class="group flex flex-col gap-3 rounded-tile bg-mist p-4 transition-shadow hover:shadow-lg/5">
          <span class="flex size-10 items-center justify-center rounded-icon bg-moss-tint text-moss">
            <hq-icon name="skills" size="lg"></hq-icon>
          </span>
          <span>
            <span class="block font-semibold text-ink">Skills</span>
            <span class="mt-0.5 block text-sm text-muted">Browse and edit skills</span>
          </span>
        </a>

        <a href="/loops/" class="group flex flex-col gap-3 rounded-tile bg-mist p-4 transition-shadow hover:shadow-lg/5">
          <span class="flex size-10 items-center justify-center rounded-icon bg-cobalt-tint text-cobalt">
            <hq-icon name="loops" size="lg"></hq-icon>
          </span>
          <span>
            <span class="block font-semibold text-ink">Loops</span>
            <span class="mt-0.5 block text-sm text-muted">Channels and loops</span>
          </span>
        </a>

        <a href="/metrics/" class="group flex flex-col gap-3 rounded-tile bg-mist p-4 transition-shadow hover:shadow-lg/5">
          <span class="flex size-10 items-center justify-center rounded-icon bg-mauve-tint text-mauve">
            <hq-icon name="metrics" size="lg"></hq-icon>
          </span>
          <span>
            <span class="block font-semibold text-ink">Metrics</span>
            <span class="mt-0.5 block text-sm text-muted">View usage analytics</span>
          </span>
        </a>
      </nav>

      <section id="notifications-prompt" class="mt-8 flex hidden items-center gap-4 rounded-tile bg-mist p-4">
        <span class="flex size-10 shrink-0 items-center justify-center rounded-icon bg-teal-tint text-teal">
          <hq-icon name="bell" size="lg"></hq-icon>
        </span>
        <div class="flex-1">
          <p class="font-semibold text-ink">Enable notifications</p>
          <p class="mt-0.5 text-sm text-muted">Get notified about your agenda, email, and reminders.</p>
        </div>
        <hq-button id="enable-notifications">Enable</hq-button>
      </section>
    </main>
    <script type="module" src="/notifications.js"></script>
    <script src="/register-sw.js"></script>
  </body>
</html>
